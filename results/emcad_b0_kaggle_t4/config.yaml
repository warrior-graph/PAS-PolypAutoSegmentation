experiment: emcad_b0
seed: 42
device: auto
output_dir: runs
data:
  root: /tmp/pas_data
  train_dir: TrainDataset
  test_dir: TestDataset
  test_sets:
  - Kvasir
  - CVC-ClinicDB
  - CVC-ColonDB
  - ETIS-LaribPolypDB
  - CVC-300
  image_size: 352
  val_fraction: 0.1
  num_workers: 4
model:
  name: emcad
  encoder: pvt_v2_b0
  pretrained: true
  kernel_sizes:
  - 1
  - 3
  - 5
  expansion: 2
train:
  epochs: 100
  batch_size: 16
  grad_accum: 1
  lr: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 2
  grad_clip: 0.5
  multi_scale:
  - 0.75
  - 1.0
  - 1.25
  deep_supervision: mutation
  amp: true
  val_every: 1
